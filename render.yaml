services:
  # BACKEND SERVICE
  - type: web
    name: sktradeandsuppliers-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # You MUST add your actual MONGODB_URI in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true

  # FRONTEND SERVICE
  - type: web
    name: sktradeandsuppliers
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sktradeandsuppliers-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
